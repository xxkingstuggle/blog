name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Refuse placeholder production configuration
        run: '! grep -q "00000000-0000-0000-0000-000000000000" wrangler.jsonc'
      - run: npx wrangler d1 migrations apply blog-production --remote
      - run: npx wrangler deploy
      - run: node scripts/verify-release.mjs https://blog-production.guozhongeba.workers.dev/__build.json "$GITHUB_SHA"
