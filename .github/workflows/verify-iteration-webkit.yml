name: Safari WebKit smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/styles/iteration.css'
      - 'src/styles/iteration-gallery.css'
      - 'src/styles/godly.css'
      - 'src/styles/godly-fidelity.css'
      - 'src/styles/glass-media.css'
      - 'src/styles/ambient-editorial.css'
      - 'src/styles/optical-system.css'
      - 'src/styles/chromatic-atmosphere.css'
      - 'src/styles/cloth-media.css'
      - 'src/scripts/cloth-pressure.ts'
      - 'src/scripts/gallery-video.ts'
      - 'src/pages/lab/**'
      - 'src/content.config.ts'
      - 'public/media/**'
      - 'scripts/verify-media-budget.mjs'
      - 'src/scripts/ambient-stage.ts'
      - 'src/styles/admin-glass.css'
      - 'src/scripts/glass-palette.ts'
      - 'src/components/SiteHeader.astro'
      - 'src/components/GalleryCard.astro'
      - 'src/components/GalleryHero.astro'
      - 'src/components/admin/AppPreview.astro'
      - 'src/components/NavIcon.astro'
      - 'src/components/ThemeSwitcher.astro'
      - 'src/components/article/**'
      - 'src/scripts/mobile-dock.ts'
      - 'src/styles/admin-studio.css'
      - 'src/pages/index.astro'
      - 'src/pages/posts/**'
      - 'src/pages/software/**'
      - 'src/pages/admin-shell/apps/**'
      - 'scripts/verify-studio-webkit.mjs'
      - 'scripts/capture-godly-reference.mjs'
      - 'src/styles/iteration-editorial.css'
      - 'src/layouts/AdminLayout.astro'
      - 'src/scripts/iteration-wheel.ts'
      - 'src/pages/admin-shell/iteration/index.astro'
      - 'scripts/verify-iteration-webkit.mjs'
      - '.github/workflows/verify-iteration-webkit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-24.04 # Playwright WebKit 1.57 supports Ubuntu 24.04; latest is 26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify-media-budget.mjs
      - name: Install WebKit browser test dependencies
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps webkit
      - name: Exercise iteration UI in WebKit
        run: node scripts/verify-iteration-webkit.mjs
      - name: Exercise public gallery and private applications in WebKit
        run: node scripts/verify-studio-webkit.mjs
      - name: Capture Godly reference pages (best effort)
        run: node scripts/capture-godly-reference.mjs
        continue-on-error: true
      - name: Upload mocked desktop and mobile snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-and-iteration-webkit-snapshots
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 3
