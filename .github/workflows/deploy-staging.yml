name: Deploy staging

on:
  push:
    branches: [cms-staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npx wrangler d1 migrations apply blog-staging --remote --env staging
      - run: npx wrangler deploy --env staging
      - run: node scripts/verify-release.mjs https://blog-staging.guozhongeba.workers.dev/__build.json "$GITHUB_SHA"
